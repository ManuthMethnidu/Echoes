name: Bug Report
description: Report an issue, glitch, or playback error to help us improve Echoes
title: '[BUG] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report an issue. Please provide as much detail as possible so we can reproduce and fix it.
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened and why it seems incorrect.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the issue.
      placeholder: |
        1. Open 'https://echoes.mteck.tech/'
        2. Play track '...'
        3. Switch to visualizer / change EQ / seek
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: The track should play without stuttering / the modal should close cleanly...
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: What platform are you using?
      options:
        - Desktop Browser (Windows)
        - Desktop Browser (macOS)
        - Desktop Browser (Linux)
        - Mobile Browser (Android)
        - Mobile Browser (iOS)
        - Installed PWA (Desktop)
        - Installed PWA (Mobile)
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser & Version
      placeholder: Chrome 124, Firefox 125, Safari 17.4...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console Logs / Error Messages
      description: Open Developer Tools (F12) -> Console tab and paste any red error messages here.
      render: text
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Screen Recording
      description: Drag and drop screenshots or video recordings if applicable.
    validations:
      required: false
