services:
  echoes-backend:
    build: .
    container_name: echoes-backend
    restart: always
    ports:
      - "127.0.0.1:4040:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - NODE_OPTIONS=--dns-result-order=ipv4first --no-network-family-autoselection
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
